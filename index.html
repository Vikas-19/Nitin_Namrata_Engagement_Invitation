<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nitin &amp; Namrata – Engagement Invitation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
:root{
  --water:#07505E; --deep:#032630; --gold:#E8C170; --cream:#FFF3DA; --blush:#F4A9BE;
  /* FONTS: change these two lines to switch fonts (also update the Google Fonts link above) */
  --serif:"Playfair Display",Georgia,"Times New Roman",serif; --script:"Pinyon Script","Snell Roundhand",cursive;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--water:#05424F}}
:root[data-theme="dark"]{--water:#05424F}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--deep);color:var(--cream);font-family:var(--serif);font-weight:500;font-size:1.05rem;line-height:1.55;font-variant-numeric:lining-nums}
body.lock{overflow:hidden;height:100%}
h1,h2,h3,h4,p{margin:0}
.script{font-family:var(--script);font-weight:400}

/* Animated gold rings (transform/opacity only, no filters) */
.rgw{position:relative}
.rgw::before{content:"";position:absolute;inset:-35%;background:radial-gradient(rgba(255,214,120,.38),rgba(255,214,120,0) 65%);pointer-events:none}
.rg{position:relative;display:block;width:100%;height:auto;overflow:visible;animation:fl 4.5s ease-in-out infinite alternate}
@keyframes fl{from{transform:translateY(0) rotate(-2deg)}to{transform:translateY(-5px) rotate(2deg)}}
.rg .e{fill:none;stroke-linecap:round;stroke-dasharray:1;animation:dr 1.8s ease both}
@keyframes dr{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.rg .r1{animation:j1 2.8s cubic-bezier(.3,.1,.2,1) both}.rg .r2{animation:j2 2.8s cubic-bezier(.3,.1,.2,1) both}
@keyframes j1{from{transform:translateX(-34px)}to{transform:none}}
@keyframes j2{from{transform:translateX(34px)}to{transform:none}}
.rg .sp{transform-box:fill-box;transform-origin:center;animation:tw 2.6s ease-in-out 2.4s infinite both}
@keyframes tw{0%,100%{opacity:0;transform:scale(.2) rotate(0)}50%{opacity:1;transform:scale(1) rotate(45deg)}}
.rg:not(.on),.rg:not(.on) *{animation-play-state:paused}

/* Pond: fixed image behind everything */
#pond{position:fixed;inset:0;z-index:0;overflow:hidden;background:var(--water)}
.pb{position:absolute;top:0;left:50%;height:100%;width:calc(100svh*.5343);margin-left:calc(-50svh*.5343);background:url("pond.jpg") 0 0/100% 100%}
.lg{position:absolute;width:20%;aspect-ratio:1;margin:-10% 0 0 -10%;border-radius:50%;will-change:opacity;
  background:radial-gradient(rgba(255,196,90,.6),rgba(255,170,60,0) 68%);animation:pulse 3s ease-in-out infinite alternate}
@keyframes pulse{from{opacity:.2}to{opacity:.95}}
.petal{position:absolute;top:-30px;width:9px;height:13px;border-radius:50% 0 50% 0;background:var(--blush);opacity:.85;will-change:transform;animation:fall linear infinite}
@keyframes fall{to{transform:translate3d(70px,115vh,0) rotate(500deg)}}
.bt{position:absolute;left:31.22%;top:53.52%;width:40.16%;height:45.79%;will-change:transform}
.live .bt{animation:sail 8s cubic-bezier(.4,.05,.2,1) forwards}
@keyframes sail{to{transform:translate3d(0,-22svh,0)}}
.bt img{display:block;width:100%;height:100%;position:relative;z-index:2;transform-origin:50% 60%;will-change:transform;animation:rock 5s ease-in-out infinite alternate}
@keyframes rock{from{transform:rotate(-1.4deg) translateX(-2px)}to{transform:rotate(1.4deg) translateX(2px)}}
.bt::before{content:"";position:absolute;left:8%;right:-6%;top:6%;bottom:-3%;z-index:1;border-radius:50%;background:radial-gradient(rgba(0,25,35,.4),rgba(0,25,35,0) 70%)}
.wake{position:absolute;left:-8%;right:-8%;top:78%;height:70%;z-index:1;opacity:0;clip-path:polygon(44% 0,56% 0,100% 100%,0 100%);
  background:linear-gradient(180deg,rgba(255,255,255,.45),rgba(255,255,255,0))}
.live .wake{animation:wk 8s ease-out forwards}
@keyframes wk{0%{opacity:0}15%{opacity:.7}85%{opacity:.5}100%{opacity:.18}}
.shade{position:absolute;left:0;right:0;bottom:0;height:42%;background:linear-gradient(180deg,rgba(2,30,40,0),rgba(2,30,40,.62));pointer-events:none}

/* Hero */
.hero{position:relative;z-index:2;min-height:100svh;padding:79svh 18px 56px;text-align:center}
.hero>*{text-shadow:0 1px 8px rgba(0,30,40,.85),0 0 3px rgba(0,30,40,.6)}
.hi{opacity:0;transform:translateY(24px)}
.live .hi{animation:up 1.4s ease forwards}
@keyframes up{to{opacity:1;transform:none}}
.top{position:absolute;left:0;right:0;top:3svh;padding:0 18px}
.top>*{text-shadow:0 1px 8px rgba(0,30,40,.85),0 0 3px rgba(0,30,40,.6)}
.kick{font-style:italic;font-size:1.05rem}
.names{margin-top:2px;font-size:clamp(3.3rem,16vw,5.2rem);line-height:1.02;color:#FFEFC8;text-shadow:0 0 22px rgba(255,214,130,.7),0 2px 4px rgba(0,0,0,.5)}
.names span{display:block}.names i{font-style:normal;color:#FFC1D6;margin-right:.12em}
.rgh{position:absolute;left:50%;top:24svh;width:104px;margin-left:-52px}
.d1{animation-delay:3.2s!important}.d2{animation-delay:3.8s!important}.d3{animation-delay:4.4s!important}.d4{animation-delay:5s!important}
.quote{font-style:italic;max-width:32ch;margin:0 auto 18px}
.when{margin-bottom:18px}
.when em{display:block;font-size:.8rem;letter-spacing:.22em;text-transform:uppercase;color:#FFE3A2;font-style:normal}
.when b{display:block;font-size:1.25rem;font-weight:600;margin:2px 0}
.when span{display:block;font-size:.95rem;max-width:34ch;margin:0 auto}
.count{display:flex;gap:18px;justify-content:center;margin-bottom:22px}
.count b{display:block;font-size:2.1rem;line-height:1.1;color:#FFE3A2;text-shadow:0 0 14px rgba(255,200,100,.7)}
.count small{font-size:.85rem}
.pill{display:inline-block;padding:10px 30px;border-radius:40px;border:1.5px solid var(--gold);color:var(--cream);text-decoration:none;font:600 1rem var(--serif);cursor:pointer;text-shadow:none;
  background:linear-gradient(180deg,#0F6E76,#074652);box-shadow:0 0 16px rgba(232,193,112,.35),inset 0 1px 0 rgba(255,255,255,.25)}
.pill.g{background:linear-gradient(180deg,#FFE9A8,#E8C170);color:#5A3A08;border-color:#FFF0C0;box-shadow:0 0 18px rgba(255,214,120,.45)}
.pill small{display:block;font-size:1.1rem;line-height:.8;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(5px)}}
.pill:focus-visible,button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

/* Cards (solid backgrounds: no blur, so scrolling stays smooth) */
.wrap{position:relative;z-index:2;max-width:480px;margin:0 auto;padding:20px 18px 100px;display:grid;gap:34px}
.arch{position:relative;text-align:center;padding:92px 24px 34px;border:2px solid var(--gold);border-radius:50% 50% 28px 28px/20% 20% 28px 28px;
  background:linear-gradient(180deg,#0A4656,#05323E);box-shadow:0 10px 30px rgba(0,0,0,.4)}
.arch::before{content:"";position:absolute;inset:8px;border:1px solid rgba(232,193,112,.65);border-radius:inherit;pointer-events:none}
.arch .rgw{position:absolute;top:24px;left:50%;width:92px;margin-left:-46px}
.arch h3{font-size:2rem;font-style:italic;margin-bottom:12px;font-weight:500}
.arch p{margin-bottom:6px}
.ev .b{font-weight:600;font-size:1.2rem}.ev .n{font-size:.95rem;opacity:.9;margin:6px auto 14px;max-width:32ch}
.rv{opacity:0;transform:translateY(40px);transition:opacity .9s ease,transform .9s ease}.rv.in{opacity:1;transform:none}
.foot{text-align:center;font-size:2.6rem}

/* Intro: real door leaves swing open in 3D */
#intro{position:fixed;inset:0;z-index:50;overflow:hidden;background:#C98A45;transition:opacity 1.4s ease .4s}
.sc{position:absolute;inset:0;transform-origin:50% 45%;will-change:transform;transition:transform 2.2s cubic-bezier(.5,0,.85,.45)}
.box{position:absolute;left:50%;top:50%;width:max(100vw,59.4svh);aspect-ratio:631/1062;transform:translate(-50%,-50%);perspective:1500px;perspective-origin:51% 45%}
.full,.lt{position:absolute;inset:0}
.full{background:url("doors.jpg") 0 0/100% 100%}
.lt{opacity:0;transition:opacity .5s ease;background:radial-gradient(ellipse at 50% 58%,#fff 0,#FFF8E4 38%,#FFE1A8 78%,#F5C46F 100%)}
.lf{position:absolute;top:9.6%;width:29.32%;height:66.85%;backface-visibility:hidden;will-change:transform}
.lf.l{left:21.71%;transform-origin:0 50%}.lf.r{left:51.03%;transform-origin:100% 50%}
.lf img{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.lf .sh{opacity:0;will-change:opacity}
#intro.opening .lt{opacity:1}
#intro.opening .lf.l{animation:swl 3.2s cubic-bezier(.5,0,.2,1) forwards}
#intro.opening .lf.r{animation:swr 3.2s cubic-bezier(.5,0,.2,1) forwards}
#intro.opening .sh{animation:shd 3.2s ease forwards}
@keyframes swl{to{transform:rotateY(84deg)}}
@keyframes swr{to{transform:rotateY(-84deg)}}
@keyframes shd{to{opacity:1}}
#intro.push .sc{transform:scale(3)}
#intro.push{opacity:0}
.txt{position:absolute;left:0;right:0;top:12%;z-index:3;text-align:center;padding:0 18px;transition:opacity .6s;text-shadow:0 2px 10px rgba(0,30,40,.85),0 0 4px rgba(0,30,40,.6)}
#intro.opening .txt{opacity:0;pointer-events:none}
.txt .rgw{width:112px;margin:0 auto 4px}
.txt .names{font-size:clamp(3.1rem,15vw,4.6rem);text-shadow:0 0 18px rgba(255,235,190,.8),0 2px 6px rgba(0,0,0,.6)}
.txt p{font-style:italic;margin:10px 0 36px}
.txt small{display:block;margin-top:12px;font-size:.9rem}
.skip{position:absolute;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:4;padding:6px 18px;font-size:.9rem}
#intro.opening .skip{display:none}
.music{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:60;width:50px;height:50px;border-radius:50%;border:2px solid var(--gold);cursor:pointer;
  background:#0A4A57;color:var(--gold);font-size:1.5rem;box-shadow:0 0 14px rgba(232,193,112,.45)}
.music.off{opacity:.55}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv,.hi{opacity:1;transform:none}.petal{display:none}}
</style>
</head>
<body class="lock">

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<linearGradient id="gGold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF4B8"/><stop offset=".35" stop-color="#E3B04B"/><stop offset=".7" stop-color="#9C6812"/><stop offset="1" stop-color="#F6D77A"/></linearGradient>
<linearGradient id="gGem" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".6" stop-color="#BFE6FF"/><stop offset="1" stop-color="#8CC8F0"/></linearGradient>
<clipPath id="cw"><rect x="68" y="6" width="24" height="28"/></clipPath>
</defs></svg>

<div id="pond" aria-hidden="true"><div class="pb">
  <i class="lg" style="left:29%;top:10%"></i><i class="lg" style="left:12%;top:39%;animation-delay:-1s"></i><i class="lg" style="left:84%;top:34%;animation-delay:-2s"></i>
  <i class="lg" style="left:92%;top:57%;animation-delay:-.5s"></i><i class="lg" style="left:20%;top:67%;animation-delay:-1.5s"></i><i class="lg" style="left:74%;top:82%;animation-delay:-2.5s"></i>
  <div class="bt"><div class="wake"></div><img src="boat.webp" alt="Couple in a decorated boat"></div>
</div><div class="shade"></div></div>

<main>
<header class="hero">
  <div class="top">
    <p class="kick hi" data-k="tagline"></p>
    <h1 class="names script hi"><span data-k="groom"></span><span><i>&amp;</i><b style="font-weight:400" data-k="bride"></b></span></h1>
  </div>
  <div class="rgh rgw"></div>
  <p class="quote hi d1" data-k="quote"></p>
  <div class="when hi d2"><em>Engagement Ceremony</em><b data-k="dateText"></b><span data-k="timeVenue"></span></div>
  <div class="count hi d3">
    <div><b id="cd">0</b><small>days</small></div><div><b id="ch">0</b><small>hours</small></div>
    <div><b id="cm">0</b><small>mins</small></div><div><b id="cs">0</b><small>secs</small></div>
  </div>
  <div class="hi d4"><a class="pill" href="#details">Scroll for details<small>⌄</small></a></div>
</header>

<div class="wrap" id="details">
  <section class="arch rv"><div class="rgw"></div><h3>The Engagement</h3><div id="events"></div></section>
  <section class="arch rv"><div class="rgw"></div><h3>The Location</h3><p style="font-weight:600;font-size:1.2rem" data-k="venueName"></p><p data-k="venueAddress"></p><p style="margin-top:16px"><a class="pill g" id="map" target="_blank" rel="noopener">View on Google Maps</a></p></section>
  <p class="foot script rv"><span data-k="groom"></span> &amp; <span data-k="bride"></span></p>
  <p style="text-align:center;font-family:var(--script);font-size:1.4rem" data-k="hashtag"></p>
</div>
</main>

<button class="music off" id="music" aria-label="Toggle music">♪</button>

<div id="intro">
  <div class="sc"><div class="box">
    <div class="full"></div><div class="lt" id="lt"></div>
    <div class="lf l"><img src="leafL.webp" alt=""><img class="sh" src="leafL_sh.webp" alt=""></div>
    <div class="lf r"><img src="leafR.webp" alt=""><img class="sh" src="leafR_sh.webp" alt=""></div>
  </div></div>
  <div class="txt">
    <div class="rgw"></div>
    <h2 class="names script"><span data-k="groom"></span><span><i>&amp;</i><b style="font-weight:400" data-k="bride"></b></span></h2>
    <p data-k="invite"></p>
    <button class="pill" id="open">Open the invitation</button>
    <small>Best enjoyed with sound on</small>
  </div>
  <button class="pill skip" id="skip">Skip intro</button>
</div>

<script>
/* ===== EDIT YOUR DETAILS HERE ===== */
var C={
  invite:"You are warmly invited to our engagement",
  tagline:"Together with our families",
  groom:"Nitin", bride:"Namrata",   /* groom name shows first, then bride name */
  quote:"“Your presence is our pleasure, and your blessings are our treasure.”",
  dateText:"Saturday, 24 October 2026", timeVenue:"11:00 AM · Maratha Mandal Function Hall, Manjari",
  dateISO:"2026-10-24T11:00:00",
  events:[
    {title:"Engagement Ceremony", date:"Saturday, 24 October 2026", time:"11:00 AM", note:"Join us to celebrate this special day and bless the couple.", hrs:3}
  ],
  venueName:"Maratha Mandal Function Hall", venueAddress:"Manjari",
  mapUrl:"https://maps.app.goo.gl/R45MrCXnZFSgKHY77?g_st=iw", 
  <p style="text-align:center;font-family:'Dancing Script',cursive;font-size:1.3rem">For such a cool invitation website,<br>Contact - +91 9741691242</p>
};
/* ================================== */
(function(){
  var $=function(i){return document.getElementById(i)};
  document.querySelectorAll("[data-k]").forEach(function(e){e.textContent=C[e.dataset.k]});
  $("map").href=C.mapUrl||"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(C.venueName+" "+C.venueAddress);
  /* animated rings */
  var E=function(cx,a){a=a||"";return '<ellipse class="e" pathLength="1" cx="'+cx+'" cy="50" rx="38" ry="34" stroke="url(#gGold)" stroke-width="8"'+a+'/><ellipse class="e" pathLength="1" cx="'+cx+'" cy="50" rx="35" ry="31" stroke="#FFF8D6" stroke-width="1.3" opacity=".7"'+a+'/>'};
  var RG='<svg class="rg" viewBox="0 0 160 100" aria-hidden="true"><g class="r1">'+E(62)+'</g><g class="r2">'+E(98)+
    '<polygon points="91,14 98,5 105,14 98,23" fill="url(#gGem)" stroke="#fff" stroke-width=".6"/><path class="sp" d="M98 -6L100.5 11.5L118 14L100.5 16.5L98 34L95.5 16.5L78 14L95.5 11.5Z" fill="#fff"/></g>'+
    '<g class="r1">'+E(62,' clip-path="url(#cw)"')+'</g></svg>';
  document.querySelectorAll(".rgw").forEach(function(e){e.innerHTML=RG});
  var on=function(r){r.classList.add("on")};
  document.querySelectorAll("#intro .rg").forEach(on);
  /* light behind the doors: outline of the carved doors */
  var W=631,H=1062,U=[[137,812],[137,280],[150,235],[175,200],[215,165],[260,130],[300,108],[322,102],[344,108],[384,130],[429,165],[469,200],[494,235],[507,280],[507,812]];
  $("lt").style.clipPath="polygon("+U.map(function(p){return (p[0]/W*100).toFixed(2)+"% "+(p[1]/H*100).toFixed(2)+"%"}).join(",")+")";
  /* events + calendar */
  var enc=encodeURIComponent,f=function(d){return d.toISOString().replace(/[-:]/g,"").slice(0,15)+"Z"};
  C.events.forEach(function(x){
    var s=new Date(C.dateISO),e=new Date(s.getTime()+x.hrs*36e5),d=document.createElement("div");d.className="ev";
    d.innerHTML='<p class="b"></p><p></p><p class="n"></p><a class="pill g" target="_blank" rel="noopener">Add to Google Calendar</a>';
    var c=d.children;c[0].textContent=x.date;c[1].textContent=x.time;c[2].textContent=x.note;
    c[3].href="https://calendar.google.com/calendar/render?action=TEMPLATE&text="+enc(x.title+": "+C.groom+" & "+C.bride)+"&dates="+f(s)+"/"+f(e)+"&details="+enc(x.note)+"&location="+enc(C.venueName+", "+C.venueAddress);
    $("events").appendChild(d);
  });
  function petals(p,n,cols){for(var i=0;i<n;i++){var e=document.createElement("i");e.className="petal";e.style.left=Math.random()*100+"%";
    e.style.background=cols[i%cols.length];e.style.animationDuration=(9+Math.random()*9)+"s";e.style.animationDelay="-"+Math.random()*12+"s";p.appendChild(e)}}
  petals($("pond"),10,["#F4A9BE","#FFD6E0"]);
  function tick(){var r=Math.max(0,Math.floor((new Date(C.dateISO)-new Date())/1000));
    $("cd").textContent=Math.floor(r/86400);$("ch").textContent=String(Math.floor(r%86400/3600)).padStart(2,"0");
    $("cm").textContent=String(Math.floor(r%3600/60)).padStart(2,"0");$("cs").textContent=String(r%60).padStart(2,"0")}
  tick();setInterval(tick,1000);
  var io="IntersectionObserver" in window?new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add("in");e.target.querySelectorAll(".rg").forEach(on);io.unobserve(e.target)}})},{threshold:.12}):null;
  document.querySelectorAll(".rv").forEach(function(e){if(io)io.observe(e);else{e.classList.add("in");e.querySelectorAll(".rg").forEach(on)}});
  /* music */
  var ac,pl=false,mt,sc=[392,440,494,587,659,784,880];
  function nt(fr,t,d,v){var o=ac.createOscillator(),g=ac.createGain();o.type="sine";o.frequency.value=fr;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.05);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d)}
  function play(){if(!pl)return;var t=ac.currentTime;nt(sc[Math.floor(Math.random()*7)],t,3.2,.07);if(Math.random()<.5)nt(sc[Math.floor(Math.random()*4)]/2,t+.5,4,.05);mt=setTimeout(play,900+Math.random()*900)}
  function tog(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume();pl=!pl;$("music").classList.toggle("off",!pl);if(pl)play();else clearTimeout(mt)}catch(x){}}
  $("music").addEventListener("click",tog);
  /* sequence: doors swing open > push through the light > pond, boat sails up */
  var done=false;
  function live(){document.body.classList.add("live");document.querySelectorAll(".rgh .rg").forEach(on)}
  function fin(){if(done)return;done=true;$("intro").style.display="none";document.body.classList.remove("lock");live();window.scrollTo(0,0)}
  $("open").addEventListener("click",function(){
    var g=$("intro");g.classList.add("opening");if(!pl)tog();
    var st=document.createElement("div");st.style.cssText="position:absolute;inset:0;z-index:5;pointer-events:none;overflow:hidden";g.appendChild(st);petals(st,12,["#fff","#FFD6E0","#F4A9BE"]);
    setTimeout(function(){g.classList.add("push")},2900);
    setTimeout(live,3900);
    setTimeout(fin,4900);
  });
  $("skip").addEventListener("click",fin);
})();
</script>
</body>
</html>
